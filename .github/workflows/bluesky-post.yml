name: Post to Bluesky

on:
  push:
    branches:
      - main
    paths:
      - 'src/pages/posts/*.md'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: |
          NEW_FILES=$(git diff --name-only HEAD~1 HEAD -- 'src/pages/posts/*.md')
          if [ -z "$NEW_FILES" ]; then
            echo "No new articles"
            exit 0
          fi

          SESSION=$(curl -s -X POST 'https://bsky.social/xrpc/com.atproto.server.createSession' \
            -H 'Content-Type: application/json' \
            -d "{\"identifier\":\"${BLUESKY_HANDLE}\",\"password\":\"${BLUESKY_PASSWORD}\"}")

          TOKEN=$(echo "$SESSION" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['accessJwt'])")
          DID=$(echo "$SESSION" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['did'])")

          for FILE in $NEW_FILES; do
            TITLE=$(grep '^title:' "$FILE" | head -1 | sed "s/title: '//g;s/'$//g;s/title: \"//g;s/\"$//g")
            SLUG=$(basename "$FILE" .md)
            URL="https://errsolved.com/posts/${SLUG}"
            TEXT="新記事: ${TITLE} ${URL} #開発 #エラー解決"

            python3 -c "
import urllib.request, json, os
token = os.environ['TOKEN']
did = os.environ['DID']
text = os.environ['TEXT']
from datetime import datetime, timezone
data = json.dumps({
  'repo': did,
  'collection': 'app.bsky.feed.post',
  'record': {
    'text': text,
    'createdAt': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
  }
}).encode()
req = urllib.request.Request(
  'https://bsky.social/xrpc/com.atproto.repo.createRecord',
  data=data,
  headers={'Content-Type': 'application/json', 'Authorization': f'Bearer {token}'}
)
urllib.request.urlopen(req)
print('Posted:', text)
" TOKEN="$TOKEN" DID="$DID" TEXT="$TEXT"

          done
