name: Add Affiliate Links

on:
  workflow_dispatch:

jobs:
  add-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add affiliate links to all posts
        run: python3 .github/scripts/add_affiliate_links.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/pages/posts/
          git diff --staged --quiet || git commit -m "add affiliate links to all posts"
          git push
